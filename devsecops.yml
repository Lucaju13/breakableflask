
name: Automatisation des tests DevSecOps

on: push

jobs:

  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du repository
        uses: actions/checkout@v4

      - name: Installation de Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Contrôle des dépendances
        run: |
          trivy fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupération du repository
        uses: actions/checkout@v4

      - name: Installation de Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Contrôle de sécurité du Dockerfile
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            Dockerfile

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Construction de l'image Docker
        run: |
          docker build -t breakableflask:latest .

      - name: Vérification de l'image Docker
        run: |
          docker images
          echo "Image Docker construite avec succès"
